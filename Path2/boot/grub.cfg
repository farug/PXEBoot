# Detect default NIC and its MAC
set default=0
set timeout=10

# Force HTTP config load using the client MAC as query param.
# ${net_default_mac} is usually aa:bb:cc:dd:ee:ff (lowercase).
# We URL-encode colons as they are safe in query but kept as-is is also fine.
set mac="${net_default_mac}"

# Load a dynamic menu tailored to this MAC
configfile (http,192.168.10.10)/boot/grub.mac.php?mac=$mac
