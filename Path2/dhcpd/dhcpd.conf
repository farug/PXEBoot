authoritative;

default-lease-time 600;
max-lease-time 7200;

# option domain-name "local";
# option domain-name-servers 192.168.10.2, 8.8.8.8;

# PXE architecture option
option arch code 93 = unsigned integer 16;

set client_mac = binary-to-ascii(16, 8, ":", substring(hardware, 1, 6));

subnet 192.168.10.0 netmask 255.255.255.0 {
    range 192.168.10.100 192.168.10.200;

#    option routers 192.168.10.2;
    option subnet-mask 255.255.255.0;
    option broadcast-address 192.168.10.255;

    # PXE/boot server
    next-server 192.168.10.10;

    # UEFI x86_64 HTTP boot
    if option arch = 00:07 {
        filename "grubx64.efi";
        #filename "http://192.168.10.10/boot/grubx64.efi";
    }

    # UEFI x86_64 alternative, common on some machines
    else if option arch = 00:09 {
        filename "http://192.168.10.10/boot/grubx64.efi";
    }

    # Legacy BIOS PXE fallback
    else {
        filename "grubx64.efi";
    }
}
