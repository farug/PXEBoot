# Recognize client architecture (option 93)
option arch code 93 = unsigned integer 16;

#option pxe-system-type code 94 = unsigned integer 8;

# UEFI HTTPBoot accepts a full URL as "filename"

set client_mac = binary-to-ascii(16, 8, ":", substring(hardware, 1, 6));


default-lease-time 600;
max-lease-time 7200;
authoritative;

subnet 192.168.10.0 netmask 255.255.255.0 {
  range 192.168.10.100 192.168.10.200;
  
  # Gateway/router IP - subnet ile uyumlu olmalı
  #option routers 192.168.10.1;
  
  # DNS sunucuları - genel DNS sunucuları veya yerel DNS
  #option domain-name-servers 192.168.10.1, 8.8.8.8, 8.8.4.4;
  
  # Domain name (opsiyonel)
  # option domain-name "local";
  
  # Broadcast address
  #option broadcast-address 192.168.10.255;
  
  # Subnet mask
  option subnet-mask 255.255.255.0;
  
  # NTP sunucuları (zaman senkronizasyonu için önerilir)
  # option ntp-servers 192.168.10.10;

  # Only HTTPBoot UEFI x86_64 (arch 00:07 or 00:0b, etc.)
  # 00:07 = EFI x86-64
  # 00:0b = EFI BC (BIOS Compatibility)
  # 00:13 = EFI x86-64 (alternative)
  if option arch = 00:07 or option arch = 00:0b or option arch = 00:13 {
    # UEFI HTTPBoot accepts a full URL as "filename"
    filename "http://192.168.10.10/boot/grubx64.efi?mac=$client_mac";
    next-server 192.168.10.10;
  } else {
    # Non-HTTP-capable clients are not supported in this HTTP-only setup
    filename "unsupported";
  }
}

